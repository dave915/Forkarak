[workspace]
members = ["crates/core", "crates/navigation", "crates/app"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = { version = "=0.10.0", features = ["syntect"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

