name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v1.0.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  build:
    # Native Liquid Glass stack verification uses the host /usr/bin/assetutil.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Validate tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustup component add rustfmt clippy
      - name: Test icon assets, installation and updates
        run: |
          python3 scripts/test-icon-assets.py
          python3 scripts/test-distribution.py
          python3 scripts/test-cli-launcher.py
          python3 scripts/test-language-resources.py
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check application
        run: cargo clippy --locked --workspace --all-targets --features pokarak-navigation/test-server -- -D warnings
      - name: Test application
        working-directory: /tmp
        run: cargo test --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --workspace --features pokarak-navigation/test-server
      - name: Build release
        run: ./scripts/release-macos.sh --version "$RELEASE_TAG"
      - name: Verify bundled Java installation and relocation
        run: python3 scripts/test-prepared-language-app.py --app dist/Forkarak.app
      - name: Record source revision and release notes
        run: |
          git rev-parse HEAD > dist/release/source-revision.txt
          cp "docs/releases/${RELEASE_TAG#v}.md" dist/release/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-arm64-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/release/Forkarak-macos-arm64.zip
            dist/release/forkarak-macos-arm64.tar.gz
            dist/release/SHA256SUMS
            dist/release/install.sh
            dist/release/source-revision.txt
            dist/release/release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-arm64-release
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Publish a new version rather than replacing assets.' >&2
            exit 1
          fi
          test -s release/release-notes.md
          gh release create "$RELEASE_TAG" \
            release/Forkarak-macos-arm64.zip release/forkarak-macos-arm64.tar.gz release/SHA256SUMS \
            release/install.sh release/source-revision.txt \
            --verify-tag --latest --title "Forkarak $RELEASE_TAG" \
            --notes-file release/release-notes.md
