[package]
name = "pokarak"
description = "Forkarak, a native macOS Git client for browsing commit graphs across worktrees, comparing changes, and staging individual lines or hunks."
repository = "https://github.com/dave915/Forkarak"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
rust-embed = { version = "8", features = ["debug-embed"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
pokarak-core = { path = "../core" }
pokarak-navigation = { path = "../navigation" }
smol = "2"
notify = "8"
tempfile = "3"


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSImage", "NSImageRep", "NSWorkspace", "NSBitmapImageRep", "NSColorSpace", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSBundle", "NSProcessInfo"] }
rustix = { version = "1", features = ["process", "termios"] }
alacritty_terminal = { version = "0.26.0", default-features = false }
